services:
  frontend:
    build:
      context: .
    restart: unless-stopped
    networks:
      - pre-auth-agent
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]

  backend:
    build:
      context: .
    command: ["bun", "run", "--cwd", "server", "start"]
    restart: unless-stopped
    environment:
      PORT: 3001
      CLIENT_ORIGIN: ${CLIENT_ORIGIN}
      NOTION_API_KEY: ${NOTION_API_KEY}
      NOTION_DATA_SOURCE_ID: ${NOTION_DATA_SOURCE_ID}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    networks:
      - pre-auth-agent
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - pre-auth-agent

networks:
  pre-auth-agent: {}
